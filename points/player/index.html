    <!-- meta -->

    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, shrink-to-fit=yes">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">

    <title>選手情報｜モルックオープン大会ポイントランキング｜全国モルックカレンダー</title>
</head>

<body>

    <!-- header -->
    <div class="container is-max-desktop">
        <header class="header" id="jaja-header">
        </header>
    </div>

    <!-- main -->
    <div class="container is-max-desktop">

        <!-- Title -->
        <section class="hero is-danger pt-5">
            <div class="hero-body">
                <h1 class="title is-size-2 has-text-light">選手情報
                    <p class="subtitle has-text-light">ポイントランキングに登録している選手の詳細</p>
                </h1>
            </div>
        </section>

        <!-- Links -->
        <section class="section">
            <nav class="breadcrumb mb-2" aria-label="breadcrumbs">
                <ul class="is-size-65">
                    <li><a href="../">ポイントランキング</a></li>
                    <li class="is-active"><a href="./" aria-current="page">選手情報</a></li>
                </ul>
            </nav>
            <div class="content">
                <div class="content">
                    <p>
                        <a href="#whatis">ポイントランキング(β)とは？</a>
                    </p>
                </div>

                <h3 class="title is-size-6">参加者向け：大会結果を申請する</h3>
                <div class="jaja-calendar-points-info-form">
                </div>

                <div class="content jaja-calendar-google-ads">
                </div>
            </div>
            <div class="box amazon-box" id="amazon-box">
            </div>
        </section>

        <!-- player info -->
        <section class="section" id="player-info">
        </section>

        <!-- player result table -->
        <section class="section" id="player-result">
            <h3 class="title is-size-6">入賞履歴</h3>
            <div class="field" style="max-width: 260px;">
                <label class="label is-size-65">シーズン</label>
                <div class="control">
                    <div class="select is-fullwidth is-small">
                        <select id="player-season-filter">
                            <option value="all">すべてのシーズン</option>
                        </select>
                    </div>
                </div>
            </div>
            <div id="player-result-empty" class="notification is-light has-text-centered is-size-65 jaja-display-none">
                大会結果が追加されると、履歴が表示されます。
            </div>
            <div class="content" id="player-result-table-container">
                <table class="table is-fullwidth is-narrow is-size-65 is-striped" id="player-result-table">
                    <thead>
                        <tr class="has-background-danger">
                            <th class="has-text-light"><abbr title="大会">大会</abbr></th>
                            <th class="has-text-light"><abbr title="日付">日付</abbr></th>
                            <th class="has-text-light"><abbr title="順位">位(Pts)</abbr></th>
                        </tr>
                    </thead>
                    <tbody id="player-result-content">
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Links -->
        <section class="section">
            <div class="content">
                <div class="content">
                    <p>
                        <a href="#whatis">ポイントランキング(β)とは？</a>
                    </p>
                </div>

                <h3 class="title is-size-6">参加者向け：大会結果を申請する</h3>
                <div class="jaja-calendar-points-info-form">
                </div>

                <h3 class="title is-size-6">リンク</h3>
                <div class="jaja-calendar-points-site-links">
                </div>

                <div class="content jaja-calendar-google-ads">
                </div>
            </div>
            <div class="box amazon-box" id="amazon-box">
            </div>
        </section>

    </div>

    <!-- Footer -->
    <div class="container is-max-desktop">
        <footer class="footer" id="jaja-footer">
        </footer>
    </div>
