<head>

    <!-- meta -->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, shrink-to-fit=yes">

    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../my-bulma-project.css">

        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="../script/script.js"></script>
    <script src="../script/jaja_constants.js"></script>
    <script src="../script/simple/simple.js"></script>

    <title>全国モルックカレンダー｜国内のモルック大会やイベントを紹介</title>
</head>

<body>
    <div class="container is-max-desktop">
        <header class="header" id="jaja-header">
        </header>
    </div>

    <!-- main -->
    <div class="container is-max-desktop">

        <!-- Title -->
        <section class="hero is-primary pt-5">
            <div class="hero-body">
                <h1 class="title is-size-2 has-text-light">全国モルックカレンダー
                    <p class="subtitle has-text-light">国内のモルック大会やイベントを紹介</p>
                    <p class="subtitle has-text-light is-size-65">
                        日本国内のモルック大会・体験会・練習会などのイベント情報を収集しています。<br />
                        インターネット上に公開されている情報もしくは主催者からの情報提供があったイベントを公開しています。</p>
                </h1>
            </div>
        </section>

        <section class="section">
            <div class="content">
                <div class="content">
                    <p class="">
                    <div class="buttons has-addons">
                        <button class="button is-size-65"><a href="../">トップ</a></button>
                        <button class="button is-size-65 is-static"><a href="../simple/">シンプル</a></button>
                        <button class="button is-size-65"><a href="../recent/">新しいイベント</a></button>
                    </div>
                    </p>
                    <p>
                        <a href="#info">そのほかのおしらせへ</a>
                    </p>
                </div>

                <h3 class="title is-size-6">主催者向け：掲載を申請する</h3>
                <div class="jaja-calendar-event-info-form">
                </div>

                <h3 class="title is-size-6">リンク</h3>
                <div class="jaja-calendar-site-links">
                </div>

                <div class="content jaja-calendar-google-ads">
                </div>

                <h3 class="title is-size-6">しらべる
                    <a href="#filter-top"
                        class="jaja-calendar-filter-reset is-pulled-right has-text-weight-normal is-size-65">条件をリセットする</a>
                </h3>
                <div class="">
                    <div class="field">
                        <div class="control m-2">
                            <label class="label has-background-primary-90 px-2 is-size-65">都道府県・エリア</label>
                            <div class="select is-fullwidth">
                                <select class="filter-area">
                                </select>
                            </div>
                        </div>
                        <div class="control m-2">
                            <label class="label has-background-primary-90 px-2 is-size-65">開催日</label>
                            <input type="date" name="calendar-from" class="input is-fullwidth filter-calendar-from" />
                        </div>
                        <div class="control m-2">
                            <input type="date" name="calendar-to" class="input is-fullwidth filter-calendar-to" />
                        </div>
                        <div class="control m-2 jaja-calendar-filter-category">
                            <label class="label has-background-primary-90 px-2 is-size-65">イベントの種類</label>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="content jaja-calendar-google-ads">
            </div>

            <div class="box amazon-box" id="amazon-box">
            </div>
        </section>

        <section class="section">
            <h3 class="title is-size-5">イベント一覧</h3>
        </section>
        <div class="content" id="simple-events">

        </div>

        <section class="section" id="info">
            <div class="box amazon-box" id="amazon-box">
            </div>
            <div class="content">
                <h3 class="title is-size-5">全国モルックカレンダーとは</h3>
                <div class="block is-size-65">
                    日本国内のモルック大会・体験会・練習会などのイベント情報を収集しています。インターネット上に公開されている情報もしくは主催者からの情報提供があったイベントを公開しています。
                </div>
            </div>
        </section>

    </div>

    <!-- Footer -->
    <div class="container is-max-desktop">
        <footer class="footer" id="jaja-footer">
        </footer>
    </div>

    <div id="topScroll" class="topIcon" onclick="goTop()"><i
            class="las la-angle-double-up has-text-light is-size-4"></i></div>
